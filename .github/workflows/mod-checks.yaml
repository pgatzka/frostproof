name: Mod checks
run-name: |
  ${{ github.workflow }}: ${{ github.event_name }} for ${{ github.ref_name }} by @${{ github.actor }}
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check (Space Age ${{ matrix.space-age && 'on' || 'off' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        space-age: [true, false]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/mod-checks
        with:
          space-age: ${{ matrix.space-age }}
